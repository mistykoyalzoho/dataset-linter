[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mistykoyalzoho/dataset-linter"
description = "AI-powered dataset quality linter for ML pipelines"
keywords = ["dataset", "ml", "linter", "data-quality", "openai"]
categories = ["command-line-utilities", "development-tools", "science"]

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Data
csv = "1"
polars = { version = "0.46", features = ["describe", "ndarray"] }
arrow = "54"

# OpenAI
async-openai = "0.27"

# Stats
statrs = "0.18"

# Output
colored = "3"
comfy-table = "7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
